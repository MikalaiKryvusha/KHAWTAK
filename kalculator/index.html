// ===== CORE-BEGIN (pure functions, no DOM; tested by kalculator/test.mjs)
// The core of KHAWTAK. Every physical constant carries its source next to it (AGENT_GUIDE.md → Code style).
// SI units inside; millimetres only at the print/STL boundary.

// ---- S2 · air and wind — researches/01 §5.1 (the same formulas as KATAK, so the two calculators agree)
// [NOT-TESTED] — hygiene green 2026-11-16: `node kalculator/test.mjs` 56/56 for the whole core so far (criteria 1–7 +
// the Γ, shear, Weibull, NACA, section, Schmitz, BEM, power-curve and stud identities), `--control` 19/19 mutants red. The marker flips only on a functional run of the page (TESTING_FRAMEWORK.md).

// International Standard Atmosphere: sea-level pressure, lapse rate, sea-level temperature, exponent g·M/(R·L);
// specific gas constant of dry air. source: researches/01 §5.1 (KATAK researches/01 §3.1).
const P0_PA = 101325, LAPSE_K_PER_M = 0.0065, T0_K = 288.15, ISA_EXP = 5.25588, R_AIR = 287.05;

/** Air density at altitude h_m (m above sea level) and air temperature t_C (°C), kg/m³. */
function airDensity(h_m, t_C) {
  const p = P0_PA * Math.pow(1 - LAPSE_K_PER_M * h_m / T0_K, ISA_EXP);
  return p / (R_AIR * (t_C + 273.15));
}

/** Wind at height z from V_ref at z_ref — the log law with roughness length z0 (all in m). source: researches/01 §5.1 */
function shearLog(vRef, zRef, z, z0) { return vRef * Math.log(z / z0) / Math.log(zRef / z0); }

/** Wind at height z over the SITE's roughness z0, from a station's V_ref at z_ref over ITS roughness z0Ref — two log profiles
 *  joined at the blending height hBlend: up from the station to hBlend, down over the site. One profile would give every
 *  roughness the same 10 m wind, so above 10 m trees would come out windier than fields — wrong for choosing a mast spot.
 *  Default hBlend 60 m, z0Ref 0.03 (an open station). source: researches/03 §3.2 (hBlend 40–100 m moves the speed ±3 %). */
function shearTwoLayer(vRef, zRef, z, z0, { z0Ref = 0.03, hBlend = 60 } = {}) {
  const vBlend = shearLog(vRef, zRef, hBlend, z0Ref);
  return vBlend * Math.log(z / z0) / Math.log(hBlend / z0);
}

/** Wind at height z from V_ref at z_ref — the power law with exponent alpha. source: researches/01 §5.1 */
function shearPower(vRef, zRef, z, alpha) { return vRef * Math.pow(z / zRef, alpha); }

// Lanczos approximation of Γ(x), the g = 7, n = 9 coefficient set as printed in Wikipedia «Lanczos approximation»
// (https://en.wikipedia.org/wiki/Lanczos_approximation) — written from recall, so it is PROVED by kalculator/test.mjs against
// exact values (Γ(1) = 1, Γ(5) = 24, Γ(1/2) = √π, Γ(3/2) = √π/2), not trusted by citation.
const LANCZOS_G = 7;
const LANCZOS_C = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059,
  12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
function gamma(x) {
  if (x < 0.5) return Math.PI / (Math.sin(Math.PI * x) * gamma(1 - x)); // reflection formula
  x -= 1;
  let a = LANCZOS_C[0];
  const t = x + LANCZOS_G + 0.5;
  for (let i = 1; i < LANCZOS_C.length; i++) a += LANCZOS_C[i] / (x + i);
  return Math.sqrt(2 * Math.PI) * Math.pow(t, x + 0.5) * Math.exp(-t) * a;
}

/** Weibull scale c from the mean wind and the shape k: c = V̄ / Γ(1 + 1/k). source: researches/01 §5.1 */
function weibullScale(vMean, k) { return vMean / gamma(1 + 1 / k); }

/** Weibull probability density f(v). Rayleigh is k = 2. source: researches/01 §5.1 */
function weibullPdf(v, k, c) { return v <= 0 ? 0 : (k / c) * Math.pow(v / c, k - 1) * Math.exp(-Math.pow(v / c, k)); }

/** Yearly energy, kWh: AEP = 8760 · Σ P(v)·f(v)·Δv for a power curve power_W(v). source: researches/01 §5.1 */
function yearlyEnergy_kWh(power_W, vMean, k, { vMax = 30, dv = 0.05 } = {}) {
  const c = weibullScale(vMean, k);
  let s = 0;
  for (let v = dv / 2; v < vMax; v += dv) s += power_W(v) * weibullPdf(v, k, c) * dv;
  return 8760 * s / 1000;
}

// ---- S3 · airfoil — NACA 4-digit by formula (no coordinate file, no licence), researches/04 §2.1, researches/01 §2.2
// [NOT-TESTED] — hygiene: criterion 4 and the formula's own landmarks in kalculator/test.mjs.

// NACA 4-digit half-thickness coefficients, open trailing edge (−0.1015; −0.1036 closes it).
// source: researches/04 §2.1 (Wikipedia «NACA airfoil», checked 2026-11-16)
const NACA_T = [0.2969, -0.1260, -0.3516, 0.2843, -0.1015];

/** Half-thickness y_t at chord fraction x (0…1) for thickness ratio t, as a fraction of chord. */
function nacaHalfThickness(x, t) {
  const [a0, a1, a2, a3, a4] = NACA_T;
  return 5 * t * (a0 * Math.sqrt(x) + a1 * x + a2 * x * x + a3 * x ** 3 + a4 * x ** 4);
}

/** NACA 4-digit mean line y_c and its slope at x, max camber m at position p (NACA 44xx: m 0.04, p 0.4).
 *  source: the same NACA 4-digit definition (Wikipedia «NACA airfoil», researches/04 §2.1) */
function nacaCamber(x, m, p) {
  if (m === 0) return { yc: 0, dyc: 0 };
  if (x < p) return { yc: m / (p * p) * (2 * p * x - x * x), dyc: 2 * m / (p * p) * (p - x) };
  return { yc: m / ((1 - p) ** 2) * ((1 - 2 * p) + 2 * p * x - x * x), dyc: 2 * m / ((1 - p) ** 2) * (p - x) };
}

/** Smallest chord (mm) whose airfoil is thick enough at chord fraction xStud to house a rod of diameter d_mm with a wall
 *  of wall_mm on each side: (d + 2·wall) / (2·y_t(xStud)). source: researches/01 §2.3 (at max thickness), researches/02 §4.5 */
function minChordForStud_mm(d_mm, wall_mm, t, xStud) { return (d_mm + 2 * wall_mm) / (2 * nacaHalfThickness(xStud, t)); }

/** Chord fraction where the trailing edge must be cut flat so it is never thinner than minTE_mm (a printable edge: at
 *  least two extrusion lines). Bisection on x in [0.5, 1]; returns 1 when the edge is thick enough already.
 *  source: researches/04 §2.1 (the NACA edge is 0.25 mm at t 12 %, c 100 mm) */
function printableTrailingEdgeX(t, chord_mm, minTE_mm) {
  const thick = (x) => 2 * nacaHalfThickness(x, t) * chord_mm;
  if (thick(1) >= minTE_mm) return 1;
  let lo = 0.5, hi = 1;
  for (let i = 0; i < 60; i++) { const mid = (lo + hi) / 2; if (thick(mid) >= minTE_mm) lo = mid; else hi = mid; }
  return lo;
}

/** One blade section as a closed counter-clockwise polygon [[x, y], …] in mm. The origin is the stud axis — the point of the
 *  mean line at xStud (0.40c, researches/02 §4.5) — and the section is turned by twist_rad about it (researches/04 §2.2:
 *  the twist axis IS the stud axis). Cosine spacing over [0, xCut] (dense at the nose and the edge); thickness laid off
 *  normal to the mean line; the trailing edge cut flat at xCut where it would be thinner than minTE_mm (researches/04 §2.1).
 *  Order: upper surface edge → nose, then lower surface nose → edge (counter-clockwise for x toward the edge, y up). */
function airfoilSection({ chord_mm, t, m = 0.04, p = 0.4, n = 60, twist_rad = 0, xStud = 0.40, minTE_mm = 0 }) {
  const xCut = minTE_mm > 0 ? printableTrailingEdgeX(t, chord_mm, minTE_mm) : 1;
  const ox = xStud, oy = nacaCamber(xStud, m, p).yc;            // the stud axis on the mean line
  const cs = Math.cos(twist_rad), sn = Math.sin(twist_rad);
  const place = (x, y) => {                                     // to mm, origin at the stud axis, then the twist
    const X = (x - ox) * chord_mm, Y = (y - oy) * chord_mm;
    return [X * cs - Y * sn, X * sn + Y * cs];
  };
  const upper = [], lower = [];
  for (let i = 0; i <= n; i++) {
    const x = (1 - Math.cos(Math.PI * i / n)) / 2 * xCut;      // 0 … xCut
    const yt = nacaHalfThickness(x, t);
    const { yc, dyc } = nacaCamber(x, m, p);
    const th = Math.atan(dyc);
    upper.push(place(x - yt * Math.sin(th), yc + yt * Math.cos(th)));
    lower.push(place(x + yt * Math.sin(th), yc - yt * Math.cos(th)));
  }
  return upper.reverse().concat(lower.slice(1));                 // the nose point once
}

/** Signed area of a polygon (shoelace), mm²: positive = counter-clockwise. */
function polygonArea(poly) {
  let s = 0;
  for (let i = 0; i < poly.length; i++) { const [x1, y1] = poly[i], [x2, y2] = poly[(i + 1) % poly.length]; s += x1 * y2 - x2 * y1; }
  return s / 2;
}

/** Is point [x, y] inside the polygon (even-odd ray cast)? */
function pointInPolygon([x, y], poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

// ---- S4 · blade design — Schmitz optimum (wake rotation, no tip loss) and its straight-line simplification.
// source: researches/01 §1.3 (Schmitz [6] (1)–(2); Burton's trapezium through the optimum at 70 % and 90 % span, §3.3)
// [NOT-TESTED] — hygiene: criterion 2 in kalculator/test.mjs.

/** Schmitz inflow angle φ(r) = (2/3)·arctan(R / (r·λ)), rad. */
function schmitzPhi(r, R, lambda) { return (2 / 3) * Math.atan(R / (r * lambda)); }

/** Schmitz chord c(r) = 16πr / (B·C_l) · sin²((1/3)·arctan(R / (r·λ))), in the units of r. */
function schmitzChord(r, R, B, Cl, lambda) {
  const s = Math.sin(Math.atan(R / (r * lambda)) / 3);
  return 16 * Math.PI * r / (B * Cl) * s * s;
}

/** Twist (setting angle) θ(r) = φ(r) − α_design, rad. */
function schmitzTwist(r, R, lambda, alphaD_rad) { return schmitzPhi(r, R, lambda) - alphaD_rad; }

/** The printable blade: chord and twist as straight lines through the Schmitz optimum at 0.7R and 0.9R (Burton). */
function linearBlade({ R, B = 3, Cl, lambda, alphaD_rad }) {
  const r1 = 0.7 * R, r2 = 0.9 * R;
  const c1 = schmitzChord(r1, R, B, Cl, lambda), c2 = schmitzChord(r2, R, B, Cl, lambda);
  const t1 = schmitzTwist(r1, R, lambda, alphaD_rad), t2 = schmitzTwist(r2, R, lambda, alphaD_rad);
  const lerp = (a, b) => (r) => a + (b - a) * (r - r1) / (r2 - r1);
  return { chord: lerp(c1, c2), twist: lerp(t1, t2) };
}

// ---- S5 · BEM — Ning's single-unknown method with Prandtl tip/hub loss and Buhl's high-induction branch, verbatim from
// researches/01 §1.4–1.5 (NREL CCBlade bem.f90, Apache 2.0). [NOT-TESTED] — hygiene: criterion 3 in kalculator/test.mjs.

/** Prandtl loss F = F_tip · F_hub at radius r for inflow angle phi. source: researches/01 §1.4 */
function prandtlF(r, R, Rhub, B, phi) {
  const s = Math.abs(Math.sin(phi));
  const fTip = (2 / Math.PI) * Math.acos(Math.exp(-(B / 2) * (R - r) / (r * s)));
  const fHub = (2 / Math.PI) * Math.acos(Math.exp(-(B / 2) * (r - Rhub) / (Rhub * s)));
  return fTip * fHub;
}

/** Inductions a, a′ and the residual R(φ) at one station. source: researches/01 §1.5 */
function bemResidual(phi, { r, R, Rhub, B, chord, twist, lambdaR, polar }) {
  const sp = Math.sin(phi), cp = Math.cos(phi);
  const { Cl, Cd } = polar(phi - twist);
  const cn = Cl * cp + Cd * sp, ct = Cl * sp - Cd * cp;
  const F = prandtlF(r, R, Rhub, B, phi);
  const sigma = B * chord / (2 * Math.PI * r);
  const k = sigma * cn / (4 * F * sp * sp), kp = sigma * ct / (4 * F * sp * cp);
  let a;
  if (k <= 2 / 3) a = k / (1 + k);
  else {                                                        // Buhl's high-induction correction
    const g1 = 2 * F * k - (10 / 9 - F), g2 = 2 * F * k - F * (4 / 3 - F), g3 = 2 * F * k - (25 / 9 - 2 * F);
    a = Math.abs(g3) < 1e-6 ? 1 - 1 / (2 * Math.sqrt(g2)) : (g1 - Math.sqrt(g2)) / g3;
  }
  const ap = kp / (1 - kp);
  return { res: sp / (1 - a) - cp * (1 - kp) / lambdaR, a, ap, cn, ct };
}

/** Solve one station: bisection for the root of R(φ) on (0, π/2]. */
function bemStation(st) {
  let lo = 1e-6, hi = Math.PI / 2;
  let flo = bemResidual(lo, st).res;
  for (let i = 0; i < 100; i++) {
    const mid = (lo + hi) / 2, fm = bemResidual(mid, st).res;
    if ((fm < 0) === (flo < 0)) { lo = mid; flo = fm; } else hi = mid;
  }
  const phi = (lo + hi) / 2;
  return { phi, ...bemResidual(phi, st) };
}

/** Rotor Cp and Ct at tip-speed ratio lambda: blade = { chord(r), twist(r) } in m and rad, polar(alpha) → { Cl, Cd };
 *  n annuli from Rhub to R (midpoint rule). source: researches/01 §1.5 (loads per unit length and the rotor integrals) */
function bemRotor({ R, Rhub, B = 3, lambda, blade, polar, n = 200 }) {
  const V = 1, rho = 1, omega = lambda * V / R, dr = (R - Rhub) / n;
  let T = 0, Q = 0;
  for (let i = 0; i < n; i++) {
    const r = Rhub + (i + 0.5) * dr, chord = blade.chord(r);
    const s = bemStation({ r, R, Rhub, B, chord, twist: blade.twist(r), lambdaR: lambda * r / R, polar });
    const W2 = V * V * (1 - s.a) ** 2 + (omega * r) ** 2 * (1 + s.ap) ** 2;
    T += B * s.cn * 0.5 * rho * W2 * chord * dr;
    Q += B * s.ct * 0.5 * rho * W2 * chord * r * dr;
  }
  const A = Math.PI * R * R;
  return { Cp: omega * Q / (0.5 * rho * A * V ** 3), Ct: T / (0.5 * rho * A * V * V) };
}

// ---- S6 · performance — the owner's smart controller holds λ near its optimum (interview 001 Q5), so below rated the
// rotor delivers ½ρA·Cp_e·V³; above rated the power is held flat (the brake/furling are after the MVP).
// source: researches/01 §7 (Cp_e 0.25 = rotor Cp 0.33–0.35 × efficiency 0.75; cut-in 3 m/s; rated 10.5 m/s),
// researches/03 Appendix A (the same model); v_tip warning: researches/01 §6.4. [NOT-TESTED] — hygiene in test.mjs.
const PERF_DEFAULT = { CpE: 0.25, vCutIn: 3, vRated: 10.5, vTipWarn: 65 };

/** Electrical power curve P(v), W, for rotor diameter D_m at air density rho. */
function powerCurve({ D_m, rho, CpE = PERF_DEFAULT.CpE, vCutIn = PERF_DEFAULT.vCutIn, vRated = PERF_DEFAULT.vRated }) {
  const A = Math.PI * D_m * D_m / 4;
  return (v) => v < vCutIn ? 0 : 0.5 * rho * A * CpE * Math.pow(Math.min(v, vRated), 3);
}

/** Tip speed λ·V (m/s) and whether it passes the noise/erosion warning (researches/01 §6.4: 60–70 m/s). */
function tipSpeed(lambda, v) { const vt = lambda * v; return { vTip: vt, warn: vt > PERF_DEFAULT.vTipWarn }; }

// ---- S8 · structure (first part) — the joint preload, the wrench torque, the smallest stud for the user's grade.
// [NOT-TESTED] — hygiene: criteria 5 and 6 in test.mjs. Section properties (I, A, k of the shell) come next session.

// Metric coarse studs M3–M14: stress area As (mm²), proof loads of classes 4.8 and 8.8 (kN) — ISO 898-1 via
// researches/02 §4.2; stainless A2-70: σ0.2 ≥ 450 MPa (researches/02 §4.2 [24]), capacity As·450.
const STUDS = {
  M3: { d: 3, As: 5.03, p48: 1.56, p88: 2.92 }, M4: { d: 4, As: 8.78, p48: 2.77, p88: 5.10 },
  M5: { d: 5, As: 14.2, p48: 4.40, p88: 8.23 }, M6: { d: 6, As: 20.1, p48: 6.23, p88: 11.6 },
  M8: { d: 8, As: 36.6, p48: 11.4, p88: 21.2 }, M10: { d: 10, As: 58.0, p48: 18.0, p88: 33.7 },
  M12: { d: 12, As: 84.3, p48: 26.1, p88: 48.9 }, M14: { d: 14, As: 115, p48: 35.6, p88: 66.7 },
};
const A2_70_RP02_MPA = 450;

/** Load capacity of a stud, kN, for grade '4.8' · '8.8' · 'A2-70'. */
function studCapacity_kN(size, grade) {
  const s = STUDS[size];
  if (grade === '4.8') return s.p48;
  if (grade === '8.8') return s.p88;
  if (grade === 'A2-70') return s.As * A2_70_RP02_MPA / 1000;
  throw new Error('unknown stud grade ' + grade);
}

/** The thinnest stud M3–M14 whose capacity is at least margin × the load F_kN; null when even M14 is not enough. */
function smallestStud(F_kN, grade, margin = 1.5) {
  for (const size of Object.keys(STUDS)) if (studCapacity_kN(size, grade) >= margin * F_kN) return size;
  return null;
}

/** Preload that keeps a joint closed: F0 = M/k + F_c (M in N·m, kern distance k in mm, F_c in N) → N.
 *  source: researches/02 §2.3 */
function jointPreload_N(M_Nm, k_mm, Fc_N) { return M_Nm * 1000 / k_mm + Fc_N; }

/** Wrench torque T = K·F·d (K ≈ 0.2 dry, its scatter ±25–30 %) → N·m. source: researches/02 §5.1 */
function wrenchTorque_Nm(F_N, d_mm, K = 0.2) { return K * F_N * d_mm / 1000; }

// The owner's site as the default: a village in Brest region (owner 2026-11-16 21:16), 160 m above sea level; the
// reference wind 3.0 m/s at 10 m over open ground, Weibull k 1.8 (Baranovichi WMO 26941, 1991–2020), mean air 7.4 °C.
// source: researches/03 §0, §2.4, Appendix A.
const SITE_DEFAULT = { name: 'Brest region', altitude_m: 160, t_C: 7.4, vRef: 3.0, zRef: 10, k: 1.8, z0: 0.25 };

const KHAWTAK = { airDensity, shearLog, shearTwoLayer, shearPower, gamma, weibullScale, weibullPdf, yearlyEnergy_kWh, SITE_DEFAULT,
  nacaHalfThickness, nacaCamber, minChordForStud_mm, printableTrailingEdgeX, airfoilSection, polygonArea, pointInPolygon,
  schmitzPhi, schmitzChord, schmitzTwist, linearBlade, prandtlF, bemStation, bemRotor, PERF_DEFAULT, powerCurve, tipSpeed,
  STUDS, studCapacity_kN, smallestStud, jointPreload_N, wrenchTorque_Nm };
// ===== CORE-END
window.KHAWTAK = KHAWTAK;
</script>
