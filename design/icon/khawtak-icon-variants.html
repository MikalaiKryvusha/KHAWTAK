<h1>KHAWTAK — иконка, круг 1 (вторая правка: лопасти шире, следы ярче)</h1>
<p class="lead">Классический трёхлопастный ветряк со следами ветра за лопастями, в рамке и цветах иконки KATAK. Каждый вариант — в размерах 256, 64, 32 и 16 пикселей.</p>
<div class="grid">
<figure><div class="big"><img src="khawtak-icon-a.svg" width="256" height="256" alt=""></div>
    <div class="small"><img src="khawtak-icon-a.svg" width="64" height="64" alt=""><img src="khawtak-icon-a.svg" width="32" height="32" alt=""><img src="khawtak-icon-a.svg" width="16" height="16" alt=""></div>
    <figcaption><b>А. Дуги скорости</b><br>Вид спереди; за каждой лопастью три тающие дуги — у конца длиннее (конец лопасти идёт быстрее).</figcaption></figure>
<figure><div class="big"><img src="khawtak-icon-b.svg" width="256" height="256" alt=""></div>
    <div class="small"><img src="khawtak-icon-b.svg" width="64" height="64" alt=""><img src="khawtak-icon-b.svg" width="32" height="32" alt=""><img src="khawtak-icon-b.svg" width="16" height="16" alt=""></div>
    <figcaption><b>Б. Шлейф</b><br>Вид спереди; за каждой лопастью тающие розовые «тени» её прежних положений — как на снимке с выдержкой.</figcaption></figure>
<figure><div class="big"><img src="khawtak-icon-c.svg" width="256" height="256" alt=""></div>
    <div class="small"><img src="khawtak-icon-c.svg" width="64" height="64" alt=""><img src="khawtak-icon-c.svg" width="32" height="32" alt=""><img src="khawtak-icon-c.svg" width="16" height="16" alt=""></div>
    <figcaption><b>В. Спиральный след</b><br>Вид спереди; от концов лопастей назад уходит тающая спираль — след вихря и поклон спирали KATAK.</figcaption></figure>
<figure><div class="big"><img src="khawtak-icon-d.svg" width="256" height="256" alt=""></div>
    <div class="small"><img src="khawtak-icon-d.svg" width="64" height="64" alt=""><img src="khawtak-icon-d.svg" width="32" height="32" alt=""><img src="khawtak-icon-d.svg" width="16" height="16" alt=""></div>
    <figcaption><b>Г. Ветряк на мачте, дуги</b><br>Классический силуэт: мачта и ротор; за лопастями дуги скорости, как в варианте А.</figcaption></figure>
<figure><div class="big"><img src="khawtak-icon-e.svg" width="256" height="256" alt=""></div>
    <div class="small"><img src="khawtak-icon-e.svg" width="64" height="64" alt=""><img src="khawtak-icon-e.svg" width="32" height="32" alt=""><img src="khawtak-icon-e.svg" width="16" height="16" alt=""></div>
    <figcaption><b>Д. Ветряк на мачте, струи ветра</b><br>Мачта и ротор; слева набегают струи ветра, за ротором они закручиваются тающими дугами.</figcaption></figure>
<figure><div class="big"><img src="khawtak-icon-f.svg" width="256" height="256" alt=""></div>
    <div class="small"><img src="khawtak-icon-f.svg" width="64" height="64" alt=""><img src="khawtak-icon-f.svg" width="32" height="32" alt=""><img src="khawtak-icon-f.svg" width="16" height="16" alt=""></div>
    <figcaption><b>Е. Веер</b><br>Вид спереди; за каждой лопастью тающий залитый сектор — так глаз видит быстро крутящийся ротор.</figcaption></figure>
